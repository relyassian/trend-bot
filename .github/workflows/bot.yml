name: trend-bot

on:
  schedule:
    # Weekdays at 14:45 UTC = 10:45am ET in summer, 9:45am ET in winter (both during market hours).
    # GitHub may start scheduled runs a few minutes late; that's fine for this strategy.
    - cron: "45 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what it would do, place no orders)"
        type: boolean
        default: true

concurrency:
  group: trend-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python bot.py
