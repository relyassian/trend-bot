name: trend-bot

on:
  schedule:
    # GitHub often delays these by hours, so the main trigger is an outside daily check that
    # starts this workflow at 10:50am ET (backup 2:50pm). These timers are extra tries.
    # Only the first successful run each day does anything; the others see it already ran and stop.
    - cron: "45 14 * * 1-5"
    - cron: "15 16 * * 1-5"
    - cron: "45 17 * * 1-5"
    - cron: "15 19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what it would do, place no orders)"
        type: boolean
        default: true
      skip_if_done:
        description: "Do nothing if today's run already happened (used by the daily check)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # only used by the keep-alive step at the bottom

concurrency:
  group: trend-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Today's date (New York)
        id: date
        run: echo "d=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      # Scheduled runs skip if today already ran. A real (non-dry) manual run always runs,
      # and counts as today's run so the later scheduled tries don't repeat it.
      - name: Check if today's run already happened
        id: ran
        if: github.event_name == 'schedule' || inputs.dry_run == false
        uses: actions/cache@v4
        with:
          path: .ran-today
          key: ran-${{ steps.date.outputs.d }}

      - name: Decide whether to run
        id: go
        run: |
          if [ "${{ steps.ran.outputs.cache-hit }}" = "true" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.skip_if_done }}" = "true" ]; }; then
            echo "Today's run already happened. Nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.go.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.go.outputs.run == 'true'

      - name: Run bot
        if: steps.go.outputs.run == 'true'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python bot.py

      # Mark today as done only after a successful scheduled run. If the bot failed,
      # nothing is saved, so the next scheduled try runs it again.
      - name: Mark today as done
        if: (github.event_name == 'schedule' || inputs.dry_run == false) && steps.go.outputs.run == 'true' && steps.ran.outputs.cache-hit != 'true'
        run: echo "${{ steps.date.outputs.d }}" > .ran-today

      # Public repos have their schedules switched off after 60 days without activity.
      # Re-enabling the workflow on every scheduled run resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bot.yml/enable" || true
